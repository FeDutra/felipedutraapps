name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Plataforma de build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - linux
          - both

jobs:
  build-macos:
    if: ${{ github.event.inputs.target == 'macos' || github.event.inputs.target == 'both' }}
    runs-on: ${{ (startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.')) && 'macos-15-intel' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Runners macos-latest sao Apple Silicon (arm64), mas o sidecar
          # kokoro_runner versionado no repo so existe em x86_64. Compilar
          # mirando x86_64 roda em qualquer Mac via Rosetta 2.
          targets: x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Prepare Kokoro desktop resources
        if: ${{ !(startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.')) }}
        run: npm run pulso:setup

      - name: Build Tauri app (macOS, x86_64)
        if: ${{ !(startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.')) }}
        run: npm run pulso:app:build -- --target x86_64-apple-darwin
        env:
          NEXT_PUBLIC_KOKORO_ENDPOINT: ${{ vars.NEXT_PUBLIC_KOKORO_ENDPOINT }}

      - name: Verify sovereign Desktop boundary
        if: ${{ startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.') }}
        run: npm run pulso:alpha:verify

      - name: Prepare Alpha Core, Kokoro, Intel Node and official Codex sidecars
        if: ${{ startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.') }}
        run: npm run pulso:alpha:prepare

      - name: Build isolated Alpha bundle
        if: ${{ startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.') }}
        run: >-
          npx tauri build
          --target x86_64-apple-darwin
          --bundles app
          --config src-tauri/tauri.canary.conf.json

      - name: Generate release provenance manifest
        if: ${{ !(startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.')) }}
        shell: bash
        run: |
          APP_PATH="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_SHA256="$(shasum -a 256 "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE" | awk '{print $1}')"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          mkdir -p release-metadata
          printf '%s\n' \
            "release_version=$APP_VERSION" \
            "git_commit=$GITHUB_SHA" \
            "git_ref=$GITHUB_REF" \
            "target=x86_64-apple-darwin" \
            "app_file=$(basename "$APP_PATH")" \
            "app_executable_sha256=$APP_SHA256" \
            "dmg_file=$(basename "$DMG_PATH")" \
            "dmg_sha256=$DMG_SHA256" \
            > release-metadata/PULSO-release-manifest.txt
          cat release-metadata/PULSO-release-manifest.txt

      - name: Upload macOS build artifact
        if: ${{ !(startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.')) }}
        uses: actions/upload-artifact@v4
        with:
          name: pulso-macos-build
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            release-metadata/PULSO-release-manifest.txt
          if-no-files-found: warn

      - name: Verify Alpha identity and write provenance
        if: ${{ startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html || { echo 'Missing default Tauri desktop entry' >&2; exit 1; }
          grep -Fq 'data-pulso-desktop-root="true"' out/index.html || { echo 'Default Tauri desktop entry is not the native desktop HOME' >&2; exit 1; }
          test -s out/pulso/live/index.html || { echo 'Missing canonical live export' >&2; exit 1; }
          app="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/PULSO Next Preview.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.felipedutraapps.pulso.next-preview"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "0.9.0"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -n "$executable"
          test -x "$app/Contents/MacOS/$executable"
          file "$app/Contents/MacOS/$executable" | grep -q 'x86_64'
          pulso_node="$(find "$app/Contents/MacOS" -name 'pulso-node*' -type f -perm -111 -print -quit)"
          pulso_codex="$(find "$app/Contents/MacOS" -name 'pulso-codex*' -type f -perm -111 -print -quit)"
          code_mode_host="$(find "$app/Contents/MacOS" -name 'codex-code-mode-host*' -type f -perm -111 -print -quit)"
          kokoro_runner="$(find "$app/Contents/MacOS" -name 'kokoro_runner*' -type f -perm -111 -print -quit)"
          test -n "$pulso_node" || { echo 'Missing executable pulso-node sidecar' >&2; exit 1; }
          test -n "$pulso_codex" || { echo 'Missing executable official Codex sidecar' >&2; exit 1; }
          test -n "$code_mode_host" || { echo 'Missing executable Codex Code Mode host' >&2; exit 1; }
          test -n "$kokoro_runner" || { echo 'Missing executable Kokoro sidecar' >&2; exit 1; }
          file "$pulso_codex" | grep -q 'x86_64' || { echo 'Codex sidecar is not Intel x86_64' >&2; exit 1; }
          file "$code_mode_host" | grep -q 'x86_64' || { echo 'Codex Code Mode host is not Intel x86_64' >&2; exit 1; }
          codex_version="$("$pulso_codex" --version)"
          test "$codex_version" = "codex-cli 0.163.0" || { echo "Unexpected Codex version: $codex_version" >&2; exit 1; }
          test -f "$app/Contents/Resources/resources/kokoro-v0_19.onnx" || { echo 'Missing Kokoro model' >&2; exit 1; }
          test -f "$app/Contents/Resources/resources/voices.bin" || { echo 'Missing Kokoro voices' >&2; exit 1; }
          core_marker="$app/Contents/Resources/resources/core/PULSO_CORE_SOURCE_COMMIT"
          test -f "$core_marker" || core_marker="$app/Contents/Resources/core/PULSO_CORE_SOURCE_COMMIT"
          test -f "$core_marker" || { echo 'Missing bundled Core provenance marker' >&2; exit 1; }
          mkdir -p release-provenance
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            echo "bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            echo "target=x86_64-apple-darwin"
            echo "core_source_commit=$(tr -d '\n' < vendor/pulso-core/PULSO_CORE_SOURCE_COMMIT)"
            echo "codex_version=$codex_version"
            echo "codex_sha256=$(shasum -a 256 "$pulso_codex" | awk '{print $1}')"
            echo "codex_code_mode_host_sha256=$(shasum -a 256 "$code_mode_host" | awk '{print $1}')"
          } > release-provenance/manifest.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" release-provenance/pulso-next-preview-v0.9.0.zip
          shasum -a 256 release-provenance/pulso-next-preview-v0.9.0.zip > release-provenance/SHA256SUMS

      - name: Upload Alpha artifact and provenance
        if: ${{ startsWith(github.ref_name, 'pulso-desktop-alpha-v0.') || startsWith(github.ref_name, 'feature/pulso-core-v0.') }}
        uses: actions/upload-artifact@v4
        with:
          name: pulso-next-preview-v0.9.0-${{ github.sha }}
          path: release-provenance/
          if-no-files-found: error
          retention-days: 14

  build-linux:
    if: ${{ github.event.inputs.target == 'linux' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (Linux)
        run: npm run pulso:app:build
        env:
          NEXT_PUBLIC_KOKORO_ENDPOINT: ${{ vars.NEXT_PUBLIC_KOKORO_ENDPOINT }}

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulso-linux-build
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
