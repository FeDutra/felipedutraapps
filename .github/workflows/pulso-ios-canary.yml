name: Build PULSO iOS Canary

on:
  push:
    branches:
      - feat/pulso-ios-tauri-secure-20261015
      - release/pulso-ios-presence-20261017
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Prove canonical PULSO source
        run: |
          test -f src/app/pulso/live/page.tsx
          test -f src/apps/pulso/pages/LivePage.tsx
          grep -F 'productName": "PULSO"' src-tauri/tauri.conf.json
          grep -F 'com.felipedutraapps.pulso.ios.canary' src-tauri/tauri.ios.conf.json
          grep -F 'browserLocalPersistence' src/shared/lib/firebase/client.ts
          grep -F 'A autenticação demorou mais do que o esperado' src/shared/services/authService.ts
          if grep -r -I -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' src src-tauri --exclude-dir=target --exclude='*.md'; then
            echo 'A interface errada do antigo cliente iOS apareceu na fonte.' >&2
            exit 1
          fi

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned PULSO iOS app
        run: npx tauri ios build --ci --no-sign --build-number 2026101701
        env:
          NEXT_PUBLIC_KOKORO_ENDPOINT: ${{ vars.NEXT_PUBLIC_KOKORO_ENDPOINT }}

      - name: Audit IPA identity and embedded surface
        run: |
          IPA="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p /tmp/pulso-ipa-audit
          ditto -x -k "$IPA" /tmp/pulso-ipa-audit
          APP="$(find /tmp/pulso-ipa-audit/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.felipedutraapps.pulso.ios.canary'
          BUNDLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" 2>/dev/null || true)"
          test "$BUNDLE_NAME" = 'PULSO'
          test -z "$DISPLAY_NAME" || test "$DISPLAY_NAME" = 'PULSO'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '0.1.1.2026101701'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP/Info.plist")" = 'audio'
          if grep -r -I -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' "$APP"; then
            echo 'O IPA contém a interface errada do antigo cliente iOS.' >&2
            exit 1
          fi
          EXECUTABLE="$APP/$BUNDLE_NAME"
          test -f "$EXECUTABLE"
          if ! grep -a -q 'pulso/live' "$EXECUTABLE"; then
            echo 'O executável Tauri não contém a rota canônica /pulso/live.' >&2
            exit 1
          fi
          shasum -a 256 "$IPA" | tee pulso-ios-canary.sha256
          cp "$IPA" PULSO-iOS-0.1.1-presence.ipa

      - name: Build and capture iPhone simulator proof
        run: |
          npx tauri ios build --ci --no-sign --target aarch64-sim --build-number 2026101701
          SIM_APP="$(find src-tauri/gen/apple/build -type d -name 'PULSO.app' -path '*sim*' -print -quit)"
          test -n "$SIM_APP"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$SIM_APP"
          xcrun simctl launch "$UDID" com.felipedutraapps.pulso.ios.canary
          sleep 12
          xcrun simctl io "$UDID" screenshot pulso-ios-canary.png

      - name: Upload audited IPA
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-iOS-0.1.1-presence
          path: |
            PULSO-iOS-0.1.1-presence.ipa
            pulso-ios-canary.sha256
            pulso-ios-canary.png
          if-no-files-found: error
          retention-days: 7
