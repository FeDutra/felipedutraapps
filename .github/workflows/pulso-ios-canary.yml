name: Build PULSO iOS Canary

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Prove canonical PULSO source
        run: |
          test -f src/app/pulso/live/page.tsx
          test -f src/apps/pulso/pages/LivePage.tsx
          grep -F 'productName": "PULSO"' src-tauri/tauri.conf.json
          grep -F 'com.felipedutraapps.pulso.ios.canary' src-tauri/tauri.ios.conf.json
          if grep -R -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' src src-tauri --exclude-dir=target --exclude='*.md'; then
            echo 'A interface errada do antigo cliente iOS apareceu na fonte.' >&2
            exit 1
          fi

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned PULSO iOS app
        run: npx tauri ios build --ci --no-sign --build-number 2026101301
        env:
          NEXT_PUBLIC_KOKORO_ENDPOINT: ${{ vars.NEXT_PUBLIC_KOKORO_ENDPOINT }}

      - name: Audit IPA identity and embedded surface
        run: |
          IPA="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p /tmp/pulso-ipa-audit
          ditto -x -k "$IPA" /tmp/pulso-ipa-audit
          APP="$(find /tmp/pulso-ipa-audit/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.felipedutraapps.pulso.ios.canary'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 'PULSO'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '2026101301'
          if grep -R -a -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' "$APP"; then
            echo 'O IPA contém a interface errada do antigo cliente iOS.' >&2
            exit 1
          fi
          grep -R -a -m1 'Central Viva do Ecossistema' "$APP"
          shasum -a 256 "$IPA" | tee pulso-ios-canary.sha256
          cp "$IPA" PULSO-Tauri-Web-16ff1cfb.ipa

      - name: Upload audited IPA
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Tauri-Web-16ff1cfb
          path: |
            PULSO-Tauri-Web-16ff1cfb.ipa
            pulso-ios-canary.sha256
          if-no-files-found: error
          retention-days: 7
