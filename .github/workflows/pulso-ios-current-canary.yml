name: Build current PULSO iPhone canary

on:
  push:
    branches:
      - feature/pulso-core-ios-20261028
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove Apple toolchain
        run: |
          test "$(uname -s)" = Darwin
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Prove current PULSO source and isolated identity
        run: |
          test -f src/app/pulso/live/page.tsx
          test -f src/apps/pulso/pages/LivePage.tsx
          grep -F 'com.felipedutraapps.pulso.ios.canary' src-tauri/tauri.ios.conf.json
          grep -F 'NEXT_PUBLIC_PULSO_RUNTIME=tauri_mobile' src-tauri/tauri.ios.conf.json
          grep -F '"url": "index.html"' src-tauri/tauri.ios.conf.json
          grep -F 'icons/icon.icns' src-tauri/tauri.conf.json
          test "$(shasum -a 256 src-tauri/icons/icon.icns | awk '{print $1}')" = '1535d355994f8ee82da91384d2a29e04d5b4440f3e6051b5c8b06e7a62283693'
          if grep -r -I -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' src src-tauri --exclude-dir=target --exclude='*.md'; then
            echo 'A interface errada do antigo cliente iOS apareceu na fonte.' >&2
            exit 1
          fi

      - name: Verify product contracts
        run: npm run pulso:alpha:verify

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Build unsigned PULSO iPhone app
        run: npx tauri ios build --ci --no-sign --build-number 2026102801
        env:
          NEXT_PUBLIC_KOKORO_ENDPOINT: ${{ vars.NEXT_PUBLIC_KOKORO_ENDPOINT }}

      - name: Audit IPA identity, icon and surface
        run: |
          IPA="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p /tmp/pulso-ipa-audit
          ditto -x -k "$IPA" /tmp/pulso-ipa-audit
          APP="$(find /tmp/pulso-ipa-audit/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.felipedutraapps.pulso.ios.canary'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = '0.9.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = '0.9.0.2026102801'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$PLIST"
          test -d "$APP"
          if grep -r -I -E 'openclaw qr|Gateway Setup|Reconhecer este iPhone|Conectar à BASE' "$APP"; then
            echo 'O IPA contém a interface errada do antigo cliente iOS.' >&2
            exit 1
          fi
          shasum -a 256 "$IPA" | tee pulso-ios-canary.sha256
          cp "$IPA" "PULSO-iPhone-0.9.0-${GITHUB_SHA:0:8}.ipa"

      - name: Upload audited iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-iPhone-0.9.0-${{ github.sha }}
          path: |
            PULSO-iPhone-0.9.0-*.ipa
            pulso-ios-canary.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Build and capture iPhone simulator proof
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          RUN_LOG=/tmp/pulso-ios-simulator.log
          npx tauri ios run --no-watch "$UDID" >"$RUN_LOG" 2>&1 &
          RUN_PID=$!
          cleanup() { kill "$RUN_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 240); do
            if xcrun simctl get_app_container "$UDID" com.felipedutraapps.pulso.ios.canary app >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$RUN_PID" 2>/dev/null; then
              cat "$RUN_LOG"
              wait "$RUN_PID"
              exit 1
            fi
            sleep 2
          done
          xcrun simctl get_app_container "$UDID" com.felipedutraapps.pulso.ios.canary app
          xcrun simctl launch "$UDID" com.felipedutraapps.pulso.ios.canary
          sleep 15
          xcrun simctl io "$UDID" screenshot pulso-ios-canary.png

      - name: Upload simulator proof
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-iPhone-0.9.0-${{ github.sha }}-simulator-proof
          path: pulso-ios-canary.png
          if-no-files-found: error
          retention-days: 7
