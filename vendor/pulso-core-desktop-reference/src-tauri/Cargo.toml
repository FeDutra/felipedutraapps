[package]
name = "pulso-core-preview"
version = "0.6.0"
description = "PULSO sovereign desktop control center"
authors = ["Felipe Dutra"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = "2.6.2"

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
