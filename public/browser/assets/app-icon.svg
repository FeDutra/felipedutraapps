<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pulso-app-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="pulso-app-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FBF9F5" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="pulso-app-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8283E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B8283E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#pulso-app-bg)" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#pulso-app-stroke)" stroke-width="2" />

  <!-- Subtle Carmem Field Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#pulso-app-glow)" />

  <!-- Institutional Circle Glyph ○ -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#FBF9F5" stroke-width="18" />
</svg>
